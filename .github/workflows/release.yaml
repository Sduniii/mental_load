name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag/version (defaults to manifest.json version)"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(python3 -c 'import json; print(json.load(open("custom_components/mental_load/manifest.json"))["version"])')
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["TAG_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          m = re.search(pattern, text, flags=re.MULTILINE | re.DOTALL)
          notes = m.group(1).strip() if m else f"Release {tag}"
          open("release_notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag }}

      - name: Build zip
        run: |
          cd custom_components
          zip -r ../mental_load.zip mental_load/
          echo "Built mental_load.zip"
          ls -lh ../mental_load.zip

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          files: mental_load.zip
          fail_on_unmatched_files: true
